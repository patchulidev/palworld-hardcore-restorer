name: Build & Release

# Builds the native exe on Windows and publishes it:
#   * push a tag like  v1.2.3   -> a versioned GitHub Release with the exe attached
#   * push to main / run manually -> refreshes a rolling "latest" pre-release
# Every run also uploads the exe as a workflow artifact you can download.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Allow the built-in GITHUB_TOKEN to create releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Puts cl.exe / the MSVC x64 toolchain on PATH.
      # (Third-party but ubiquitous; pin to a commit SHA if you want it locked down.)
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalworldHardcoreRestorer
          path: dist/PalworldHardcoreRestorer.exe
          if-no-files-found: error

      # ---- Versioned release: only when a v* tag is pushed ----
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/PalworldHardcoreRestorer.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME — Palworld Hardcore Restorer" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
               "dist/PalworldHardcoreRestorer.exe" --clobber \
               --repo "$GITHUB_REPOSITORY"

      # ---- Rolling "latest" build: on pushes to main / manual runs ----
      - name: Update "latest" build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate so the tag/notes point at the current commit.
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            "dist/PalworldHardcoreRestorer.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build (main)" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automatically built from the latest commit on \`main\` ($GITHUB_SHA). For stable versions, see the tagged releases."
